name: ArriVent
description: 'ArriVent BioPharma is a clinical-stage biopharmaceutical company focused on the
  identification, development, and commercialization of differentiated medicines to address the
  unmet medical needs of patients with difficult-to-treat diseases, beginning with cancers. The
  company operates through three strategic pillars — Discover (identifying oncology programs with
  strong scientific rationale), Partner & Collaborate (licensing promising candidates and building
  partnerships), and Develop (designing development strategies leveraging regulatory expertise).
  Its lead candidate is firmonertinib, an EGFR inhibitor, alongside ARR-002, a tetravalent
  antibody-drug conjugate. ArriVent was surfaced as a portfolio company of General Catalyst and
  added to the API Evangelist network. It publishes a corporate website and an investor relations
  site but exposes no public developer or API surface.'
